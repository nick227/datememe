        '201':
          description: The created list definition
          content:
            application/json:
              schema:
                type: object
                required: [category]
                properties:
                  category: { $ref: '#/components/schemas/AdminCategoryScalar' }
        '400':
          description: Missing field
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/lists/definitions/{id}:
    put:
      operationId: updateListDefinition
      summary: Update a List Definition's configuration (scope, prompt, item counts, flags)
      tags: [admin]
      security:
        - adminAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminUpdateListDefinitionInput' }
      responses:
        '200':
          description: The updated list definition
          content:
            application/json:
              schema:
                type: object
                required: [category]
                properties:
                  category: { $ref: '#/components/schemas/AdminCategoryScalar' }
        '400':
          description: Missing field
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/lists/definitions/{id}/entities:
    get:
      operationId: getListDefinitionCuratedEntities
      summary: The entities explicitly curated into this List Definition, in display order
      tags: [admin]
      security:
        - adminAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Curated entities
          content:
            application/json:
              schema:
                type: object
                required: [curatedEntities]
                properties:
                  curatedEntities:
                    type: array
                    items: { $ref: '#/components/schemas/AdminCuratedEntity' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      operationId: updateListDefinitionCuratedEntities
      summary: Replace this List Definition's curated entities and their order (full replace, not a merge)
      tags: [admin]
      security:
        - adminAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminUpdateCuratedEntitiesInput' }
      responses:
        '200':
          description: The list's curated entities after the replace
          content:
            application/json:
              schema:
                type: object
                required: [curatedEntities]
                properties:
                  curatedEntities:
                    type: array
                    items: { $ref: '#/components/schemas/AdminCuratedEntity' }
        '400':
          description: entities must be an array
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ── Admin: Media (batch 7) ────────────────────────────────
  /admin/media/search:
    post:
      operationId: searchTaxonomyImages
      summary: Search trusted image providers (wikimedia, tmdb, openverse, unsplash, pexels, pixabay) for candidate thumbnails
      tags: [admin]
      security:
        - adminAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminSearchImagesInput' }
      responses:
        '200':
          description: Candidate images, ranked and capped at 60 total across all providers
          content:
            application/json:
              schema:
                type: object
                required: [candidates]
                properties:
                  candidates:
                    type: array
                    items: { $ref: '#/components/schemas/AdminImageCandidate' }
        '400':
          description: query is required
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/media/import:
    post:
      operationId: importTaxonomyImage
      summary: Copy an IMPORT_ALLOWED provider candidate's bytes onto our own storage and attach it as the target's primary image
      tags: [admin]
      security:
        - adminAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminAttachImageInput' }
      responses:
        '201':
          description: The attached image
          content:
            application/json:
              schema:
                type: object
                required: [asset]
                properties:
                  asset: { $ref: '#/components/schemas/AdminMediaAsset' }
        '400':
          description: Missing/invalid candidate, or the source host isn't an approved provider host
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: The candidate isn't approved for import (use /admin/media/reference instead)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '413':
          description: Remote image exceeds the import size limit
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '502':
          description: The provider's image host did not return the image
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /admin/media/reference:
    post:
      operationId: referenceTaxonomyImage
      summary: Attach a HOTLINK_ONLY/REVIEW_REQUIRED candidate by provenance and public URL only — we never copy the bytes (falls back to a real import for an IMPORT_ALLOWED candidate)
      tags: [admin]
      security:
        - adminAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminAttachImageInput' }
      responses:
        '201':
          description: The attached image
          content:
            application/json:
              schema:
                type: object
                required: [asset]
                properties:
                  asset: { $ref: '#/components/schemas/AdminMediaAsset' }
        '400':
          description: Missing/invalid candidate
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/media/upload:
    post:
      operationId: uploadTaxonomyImage
      summary: Upload a local image file (multipart) and attach it as the target's primary image — normalized server-side (rotated, bounded to 1000px, re-encoded to WebP)
      description: >
        Multipart request — fields `entityId`/`entityTypeId`/`categoryId` (exactly
        one), an optional `crop` JSON field, and the `file` itself. No
        requestBody schema is declared here on purpose: `@fastify/multipart`
        never populates `request.body`, so any declared schema (even `{}`)
        makes every real upload fail ajv's "must be object" check — see
        MediaService's own /media/upload for the same fix. `MediaAssetPicker`
        already does real file-type/size validation.
      tags: [admin]
      security:
        - adminAuth: []
      responses:
        '201':
          description: The attached image
          content:
            application/json:
              schema:
                type: object
                required: [asset]
                properties:
                  asset: { $ref: '#/components/schemas/AdminMediaAsset' }
        '400':
          description: No file uploaded, or no taxonomy target given
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '415':
          description: Unsupported or undecodable image format
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /admin/media/assets:
    get:
      operationId: listTaxonomyImages
      summary: List every image ever attached to a taxonomy target, most recent first (the current one is the isPrimary row)
      tags: [admin]
      security:
        - adminAuth: []
      parameters:
        - in: query
          name: entityId
          schema: { type: string }
        - in: query
          name: entityTypeId
          schema: { type: string }
        - in: query
          name: categoryId
          schema: { type: string }
      responses:
        '200':
          description: This target's image history
          content:
            application/json:
              schema:
                type: object
                required: [assets]
                properties:
                  assets:
                    type: array
                    items: { $ref: '#/components/schemas/AdminMediaAsset' }
        '400':
          description: A taxonomy target is required
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ── Admin: Users (batch 3) ────────────────────────────────
  /admin/users:
    get:
      operationId: getUsers
      summary: List users, optionally filtered by search term or active plan
      tags: [admin]
      security:
        - adminAuth: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - in: query
          name: search
          schema: { type: string }
          description: Matches email, exact user id, display name, or username.
        - in: query
          name: planId
          schema: { type: string }
          description: Only users with an ACTIVE subscription to this plan.
      responses:
        '200':
          description: A page of users
          content:
            application/json:
              schema:
                type: object
                required: [users, hasMore, nextCursor]
                properties:
                  users:
                    type: array
                    items: { $ref: '#/components/schemas/AdminUserSummary' }
                  hasMore: { type: boolean }
                  nextCursor: { type: string, nullable: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/users/{id}:
    get:
      operationId: getUser
      summary: A single user's full account state, membership, and admin audit history
      tags: [admin]
      security:
        - adminAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: User detail
          content:
            application/json:
              schema:
                type: object
                required: [user, auditEvents]
                properties:
                  user: { $ref: '#/components/schemas/AdminUserDetail' }
                  auditEvents:
                    type: array
                    items: { $ref: '#/components/schemas/AdminAuditEvent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/users/ban:
    post:
      operationId: banUser
      summary: Suspend or restore a user account
      tags: [admin]
      security:
        - adminAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminBanUserInput' }
      responses:
        '200':
          description: The updated user
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: '#/components/schemas/AdminUserScalar' }
        '400':
          description: Cannot ban your own account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/users/verify:
    post:
      operationId: verifyUser
      summary: Manually mark a user's email verified or unverified
      tags: [admin]
      security:
        - adminAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminVerifyUserInput' }
      responses:
        '200':
          description: The updated user
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: '#/components/schemas/AdminUserScalar' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/users/membership:
    post:
      operationId: overrideUserMembership
      summary: Grant or change a user's active plan manually (support/comp access)
      tags: [admin]
      security:
        - adminAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminOverrideMembershipInput' }
      responses:
        '200':
          description: The resulting subscription
          content:
            application/json:
              schema:
                type: object
                required: [subscription]
                properties:
                  subscription: { $ref: '#/components/schemas/AdminSubscriptionScalar' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/users/membership/revoke:
    post:
      operationId: revokeUserMembership
      summary: Cancel a user's active membership immediately
      tags: [admin]
      security:
        - adminAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminRevokeMembershipInput' }
      responses:
        '200':
          description: The canceled subscription
          content:
            application/json:
              schema:
                type: object
                required: [subscription]
                properties:
                  subscription: { $ref: '#/components/schemas/AdminSubscriptionScalar' }
        '400':
          description: User has no active membership to revoke
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # Owned by the future Memberships migration batch, but the Users detail
  # screen's membership-override picker genuinely depends on the plan list —
  # same pulled-forward-read pattern as /admin/taxonomy/entities above. Only
  # the read is migrated; create/update stay on Memberships' batch.
  /admin/plans:
    get:
      operationId: getPlans
      summary: List all plans (active and archived) with their active-subscriber counts
      tags: [admin]
      security:
        - adminAuth: []
      responses:
        '200':
          description: All plans
          content:
            application/json:
              schema:
                type: object
                required: [plans]
                properties:
                  plans:
                    type: array
                    items: { $ref: '#/components/schemas/AdminPlan' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createPlan
      summary: Create a new membership plan
      tags: [admin]
      security:
        - adminAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminCreatePlanInput' }
      responses:
        '200':
          description: The created plan
          content:
            application/json:
              schema:
                type: object
                required: [plan]
                properties:
                  plan: { $ref: '#/components/schemas/AdminPlanScalar' }
        '400':
          description: Invalid input
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/plans/update:
    post:
      operationId: updatePlan
      summary: Update a plan's price, active status, or entitlements
      tags: [admin]
      security:
        - adminAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminUpdatePlanInput' }
      responses:
        '200':
          description: The updated plan
          content:
            application/json:
              schema:
                type: object
                required: [plan]
                properties:
                  plan: { $ref: '#/components/schemas/AdminPlanScalar' }
        '400':
          description: Price or entitlements changed on a plan with active subscriptions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
