name: System Activity Validation

on:
  pull_request:
    branches: [main]

jobs:
  system-activity:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: test_secret
          MYSQL_DATABASE: testdb
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: mysql://root:test_secret@127.0.0.1:3306/testdb
      SESSION_SECRET: ci-session-secret-not-for-production
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare DB package
        run: |
          pnpm --filter @project/db exec prisma generate --schema=prisma/schema.prisma
          pnpm --filter @project/db build
      - name: Typecheck server and worker
        run: |
          pnpm --filter server typecheck
          pnpm --filter worker typecheck
      - name: Apply migrations
        run: pnpm db:migrate:deploy
      - name: System activity tests
        run: pnpm --filter server exec vitest run src/__tests__/systemActivity.test.ts