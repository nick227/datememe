name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: test_secret
          MYSQL_DATABASE: testdb
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: mysql://root:test_secret@127.0.0.1:3306/testdb
      SESSION_SECRET: ci-session-secret-not-for-production
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      # package.json pins the exact pnpm release via packageManager; declaring
      # another version here makes pnpm/action-setup reject the workflow.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Workspace apps import @project/db through its dist entrypoint. A clean
      # CI checkout has neither generated Prisma Client nor packages/db/dist,
      # so prepare both before recursive typechecking.
      - name: Prepare DB package
        run: |
          pnpm --filter @project/db exec prisma generate --schema=prisma/schema.prisma
          pnpm --filter @project/db build

      - name: Typecheck
        run: pnpm typecheck

      - name: Generate SDK
        run: pnpm sdk:generate

      - name: Check SDK drift
        run: pnpm sdk:check

      - name: Apply DB migrations
        run: pnpm db:migrate:deploy

      - name: Test
        run: pnpm test